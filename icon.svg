<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Squircle border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Printer main body gradient -->
    <linearGradient id="printerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Printer top lid / accent gradient -->
    <linearGradient id="printerTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Primary Accent / IPP text gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Soft shadow filter for paper and printer -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background White Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- TOP PAPER (Input / Print job sheet) -->
  <g filter="url(#subtleShadow)">
    <rect x="140" y="76" width="232" height="180" rx="14" ry="14" fill="url(#paperGrad)" stroke="#CBD5E1" stroke-width="4" />
    
    <!-- Paper Header: "IPP" Bold Text -->
    <text x="256" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="62" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="3">IPP</text>
    
    <!-- Paper Content / Print Lines -->
    <rect x="176" y="174" width="160" height="8" rx="4" fill="#94A3B8" />
    <rect x="176" y="194" width="120" height="8" rx="4" fill="#CBD5E1" />
    <rect x="176" y="214" width="140" height="8" rx="4" fill="#CBD5E1" />
  </g>

  <!-- PRINTER MAIN BODY -->
  
  <!-- Main Chassis -->
  <rect x="80" y="236" width="352" height="156" rx="28" ry="28" fill="url(#printerBody)" filter="url(#dropShadow)" stroke="#334155" stroke-width="3" />

  <!-- Top Accent Bar -->
  <rect x="104" y="248" width="304" height="14" rx="7" fill="url(#printerTop)" />

  <!-- Status LED & Control Buttons -->
  <!-- Power / Network Indicator LED (Glowing Cyan / Green) -->
  <circle cx="126" cy="292" r="8" fill="#10B981" />
  <circle cx="126" cy="292" r="14" fill="#10B981" opacity="0.3" />
  
  <!-- Wi-Fi / Network symbol dots/arcs or Secondary LED -->
  <circle cx="156" cy="292" r="6" fill="#38BDF8" />
  <circle cx="180" cy="292" r="6" fill="#64748B" />

  <!-- FRONT OUTPUT SLOT -->
  <rect x="120" y="324" width="272" height="34" rx="8" ry="8" fill="#090D16" stroke="#1E293B" stroke-width="2" />

  <!-- BOTTOM PAPER (Emerging Print Job) -->
  <g filter="url(#subtleShadow)">
    <path d="M 144 336 L 368 336 L 368 424 L 144 424 Z" fill="url(#paperGrad)" stroke="#CBD5E1" stroke-width="4" />
    <!-- Emerging document lines -->
    <rect x="180" y="360" width="152" height="6" rx="3" fill="#2563EB" opacity="0.8" />
    <rect x="180" y="376" width="152" height="6" rx="3" fill="#94A3B8" />
    <rect x="180" y="392" width="104" height="6" rx="3" fill="#CBD5E1" />
  </g>
</svg>

